theme = "muon3"

[editor]
auto-pairs = false
bufferline = "always"
gutters = ["spacer"]
scrolloff = 5
cursorline = false
cursorcolumn = true
mouse = true
color-modes = true
auto-completion = false
idle-timeout = 100
continue-comments = false
end-of-line-diagnostics = "disable"
text-width = 100
trim-final-newlines = true
trim-trailing-whitespace = true
insert-final-newline = true
scroll-lines = 2

[editor.smart-tab]
enable = false

[editor.soft-wrap]
enable = true
wrap-indicator = " ～"
wrap-at-text-width = true

[editor.indent-guides]
render = true
character = "┊"
skip-levels = 0

[editor.whitespace.render]
newline = "none"
space = "none"
tab = "none"

[editor.whitespace.characters]
nbsp = "-"
newline = "╖"
space = "-"
tab = ">"
tabpad = "-"

[editor.lsp]
auto-signature-help = false
display-messages = true

[editor.statusline]
left = ["mode", "spacer", "file-base-name", "diagnostics", "spinner"]
center = ["primary-selection-length", "spacer", "selections"]
right = ["register", "spacer", "position-percentage", "spacer",  "position"]

[editor.cursor-shape]
insert = "block"
normal = "block"
select = "block"

[editor.inline-diagnostics]
cursor-line = "disable"
other-lines = "disable"
max-diagnostics = 1

[keys.normal]
"A-ret" = ["repeat_last_motion"]
"{" = ["goto_prev_paragraph"]
"}" = ["goto_next_paragraph"]
I = ["split_selection_on_newline", "insert_at_line_start"]
A = ["split_selection_on_newline", "insert_at_line_end"]
j = ["keep_primary_selection", "move_line_down"]
k = ["keep_primary_selection", "move_line_up"]
"C-l" = ["align_view_top"]
"C-o" = ["align_view_bottom"]
"C-k" = ["kill_to_line_end", "insert_mode"]
D = ["kill_to_line_end"]

[keys.insert]
# ret = ["keep_primary_selection", "collapse_selection", "normal_mode"]
ret = ["normal_mode"]
"C-l" = ["align_view_top"]

[keys.select]
"{" = ["extend_to_line_bounds", "goto_prev_paragraph"]
"}" = ["extend_to_line_bounds", "goto_next_paragraph"]
ret = ["keep_primary_selection", "collapse_selection", "normal_mode"]

[keys.select.'\']
s = ":pipe sort -u"

[keys.normal.'\']
t = ":pipe sed 's/[ \t]*$//'"
w = ":toggle soft-wrap.enable"
A = ":buffer-close-all"
q = ":buffer-close"
O = ":buffer-close-others"
r = ":reload"
R = ":config-reload"
c = ":config-open"
s = ":pipe sort -u"
"[" = ":theme muon3"
"]" = ":theme tau2"
"." = ":toggle-option file-picker.git-ignore"
"z" = ":tree-sitter-highlight-name"
# TODO: Submeny for pipes
y = ":pipe yq ea '[.]|sort_by(.name)|.[]|splitDoc'"

[keys.normal.'g']
j = "jump_backward"

[keys.normal.'\'.'\']
c = ":toggle-option auto-completion"
f = ":toggle-option auto-format"
"\\" = ":run-shell-command touch .restart"

[keys.normal.'[']
"[" = ["goto_prev_function", "align_view_top"]

[keys.normal.']']
"]" = ["goto_next_function", "flip_selections", "align_view_top"]
