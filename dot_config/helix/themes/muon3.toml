# "label" = {}
"function" = {}
"tag" = {}
"special" = {}
"markup" = {}
"diff" = {}

"diagnostic" = { bg = "#c6d1d5" }
"error" = { fg = "#b91c1c" }
"hint" = { fg = "comment" }
"info" = { fg = "comment" }
"warning" = { fg = "#a16207" }

[palette]
panel = "#bcb5b3"
foreground = "#3b353b"
background = "#dddad8"
virtual = "#2f4f4f"
soft_virtual = "#bfb8bd"
selection = "#cdc0ca"
normal_light = "#bdb0ba"
select_light = "#7da0aa"
select_dark = "#3d505a"
insert_light = "#bc9593"
insert_dark = "#6d404a"
comment = "#5d6a68"
punctuation = "#708090"
keyword = "#09506c"
constant = "#126880"
light_syntax = "#904060"
dark_syntax = "#700020"
other_syntax = "#700020"
