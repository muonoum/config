"ui.window" = { fg = "foreground", bg = "#b8b5ae" }
"ui.background" = { fg = "foreground", bg = "background" }
"ui.bufferline" = { fg = "#6b656b", bg = "panel" }
"ui.bufferline.active" = { fg = "foreground", bg = "panel" }
"ui.statusline" = { bg = "panel" }
"ui.statusline.normal" = {}
"ui.statusline.insert" = { bg = "insert_light" }
"ui.statusline.select" = { bg = "select_light" }
"ui.menu" = { fg = "foreground", bg = "panel" }
"ui.menu.selected" = { fg = "background", bg = "foreground" }
"ui.popup" = { fg = "foreground", bg = "panel" }
"ui.selection" =  { bg = "selection" }
"ui.cursor" = { bg = "normal_light" }
"ui.cursor.match" = { bg = "#b0bab1" }
"ui.cursor.primary" = { bg = "normal_light" }
"ui.cursor.primary.normal" = { bg = "normal_light" }
"ui.cursor.primary.insert" = { bg = "insert_light" }
"ui.cursor.primary.select" = { bg = "select_light" }
"ui.cursorline.primary" = { bg = "#d2cfcd" }
"ui.cursorline.secondary" = { bg = "#bdcac8" }
"ui.virtual" = { fg = "virtual" }
"ui.virtual.wrap" = { fg = "#8f888d" }
"ui.virtual.indent-guide" = { fg = "soft_virtual" }
"ui.virtual.whitespace" = { fg = "soft_virtual" }
"ui.virtual.jump-label" = { fg = "virtual", bg = "selection" }

"comment" = { fg = "comment", modifiers = ["italic"] }
"comment.unused" = { fg = "comment", modifiers = [] }
"constant" = { modifiers = [] }
"constant.builtin" = { fg = "dark_syntax", modifiers = [] }
"constant.builtin.boolean" = { fg = "constant" }
"constant.numeric" = { fg = "constant", modifiers = [] }
"operator" = { fg = "punctuation", modifiers = [] }
"punctuation" = { fg = "punctuation", modifiers = [] }
"string" = { fg = "constant", modifiers = [] }

"keyword" = { fg = "keyword", modifiers = [], underline = { style = "line" } }
"namespace" = { fg = "light_syntax", modifiers = [] }
"type" = { fg = "dark_syntax", modifiers = [] }
"constructor" = { fg = "dark_syntax", modifiers = [] }
"type.enum.variant.builtin" = { fg = "dark_syntax", modifiers = [] }

"variable" = {}
"variable.builtin" = {}
"variable.parameter" = { modifiers = [], underline = {} }
