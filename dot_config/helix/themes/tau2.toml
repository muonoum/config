# "label" = {}
"function" = {}
"tag" = {}
"special" = {}
"markup" = {}
"diff" = {}

"diagnostic" = { bg = "#17262c" }
"error" = { fg = "#b91c1c" }
"hint" = { fg = "comment" }
"info" = { fg = "comment" }
"warning" = { fg = "#a16207" }


[palette]
panel = "#2b252b"
foreground = "#a19f99"
background = "#000000"
virtual = "#708090"
soft_virtual = "#292326"
selection = "#2a1a1f"
dark_selection = "#191214"
normal_light = "#55363e"
select_light = "#363e55"
select_dark = "#3d505a"
insert_light = "#bc9593"
insert_dark = "#6d404a"
comment = "#5d6a68"
punctuation = "#4b5560"
keyword = "#416a73"
constant = "#5b8d81"
light_syntax = "#9f6277"
dark_syntax = "#96575c"
other_syntax = "#700020"
