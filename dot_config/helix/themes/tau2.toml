# "variable.parameter" = { modifiers = ["bold"], underline = {  } }
# "variable.parameter" = { modifiers = [], underline = { style = "line" } }
"variable.other" = {}
"variable.other.member" = {}
"variable.other.member.private" = {}

"attribute" = { fg = "virtual" }
"label" = { modifiers = [], underline = {} }
