[[language]]
name = "erlang"
auto-format = false

[[language]]
name = "javascript"
auto-format = true

[[language]]
name = "just"
auto-format = true

[[language]]
name = "heex"
auto-format = true

[[language]]
name = "go"
[language.formatter]
command = "goimports"

[[language]]
name = "elixir"
auto-format = true
language-servers = ["elixir-ls"]

[[language]]
name = "typescript"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

[language-server.typescript-language-server]
config = { format = { "semicolons" = "insert" } }

# [[grammar]]
# name = "gleam"

# [grammar.source]
# git = "https://github.com/gleam-lang/tree-sitter-gleam"
# rev = "0d8b4b595daf76ed30c65ab22e01504fa64a1eac"

[[language]]
name = "scheme"
formatter = { command = "raco", args = ["fmt", "-i"] }
auto-format = true
language-servers = [ "steel-language-server" ]

[language-server.steel-language-server]
command = "steel-language-server"
args = []

[[language]]
name = "rust"
indent = { tab-width = 2, unit = "  " }

[language-server.rust-analyzer.config]
check.command = "clippy"
diagnostics.disabled = ["unlinked-file"]
